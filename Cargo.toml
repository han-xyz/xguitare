[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/han-xyz/xguitare"
version = "0.1.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Casts between sample counts, indices and f32 sample math stay within audio-sized bounds.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Flags nearly every getter and constructor; the noise outweighs the misuse it would catch.
must_use_candidate = "allow"
