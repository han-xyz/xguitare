[package]
name = "xguitare-gui"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
serde_json = "1.0.154"
signal-hook = "0.4.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xguitare-client = { path = "../xguitare-client" }
xguitare-core = { path = "../xguitare-core" }
