name = "Blues"

[[module]]
type = "compressor"
[module.params]
threshold = -18
ratio = 2
attack = 10
release = 120
makeup = 2

[[module]]
type = "drive"
[module.params]
drive = 25
tone = 50
level = -3

[[module]]
type = "preamp"
[module.params]
gain = 35
master = -10
