[[module]]
type = "tonestack"
[module.params]
bass = 50
middle = 60
treble = 50

[[module]]
type = "cabinet"
ir = "default-cab.wav"

[module.params]
level = 12.0

[[module]]
type = "reverb"
[module.params]
size = 40
mix = 20
