[package]
name = "xguitare"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jack = { version = "0.13.5", default-features = false, features = ["dynamic_loading"] }
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
signal-hook = "0.4.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xguitare-client = { path = "../xguitare-client" }
xguitare-core = { path = "../xguitare-core" }
xguitare-dsp = { path = "../xguitare-dsp" }
