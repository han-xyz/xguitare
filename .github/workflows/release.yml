name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # libjack-jackd2-dev: jack-sys build script probes jack.pc; the binary loads libjack at runtime
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libjack-jackd2-dev mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read workspace version
        run: |
          version=$(awk '/^\[workspace.package\]/{s=1;next} /^\[/{s=0} s && /^version *=/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no version in [workspace.package] of Cargo.toml" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          if [ "${REF_NAME#v}" != "$VERSION" ]; then
            echo "tag $REF_NAME does not match workspace version $VERSION" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libjack-jackd2-dev
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu -p xguitare -p xguitare-gui
      - name: Package
        run: |
          name="xguitare-$VERSION"
          mkdir -p "dist/$name"
          cp target/x86_64-unknown-linux-gnu/release/xguitare target/x86_64-unknown-linux-gnu/release/xguitare-gui README.md LICENSE CHANGELOG.md "dist/$name/"
          cp crates/xguitare-gui/assets/fonts/OFL.txt "dist/$name/OFL.txt"
          tar -C dist -czf "dist/$name-x86_64-linux.tar.gz" "$name"
          (cd dist && sha256sum "$name-x86_64-linux.tar.gz" > "$name-x86_64-linux.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - name: Create the GitHub Release
        run: |
          version="${TAG#v}"
          name="xguitare-$version"
          tar -xzf "$name-x86_64-linux.tar.gz" "$name/CHANGELOG.md"
          awk -v v="$version" '
            /^## / { if (found) exit; t = $2; gsub(/[\[\]]/, "", t); found = (t == v); next }
            found { print }
          ' "$name/CHANGELOG.md" > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            notes_args=(--notes-file notes.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "${notes_args[@]}" \
            "$name-x86_64-linux.tar.gz" "$name-x86_64-linux.tar.gz.sha256"
